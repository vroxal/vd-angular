<div class="vd-search-input" [class.vd-search-input--disabled]="disabled">
  <div class="vd-search-input__container" (click)="focusInput()">
    <span class="vd-search-input__leading-icon">
      <vd-icon name="vd-icon-magnifier"></vd-icon>
    </span>

    <input
      #inputElement
      [id]="inputId"
      class="vd-search-input__input body-medium"
      type="text"
      [placeholder]="placeholder"
      [value]="value"
      (input)="onInput($event)"
      (keydown)="onKeyDown($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      [disabled]="disabled"
    />

    <span class="vd-search-input__trailing-action-container" *ngIf="value">
      <vd-icon-button
        class="vd-search-input__trailing-action"
        variant="transparent"
        color="neutral"
        [disabled]="disabled"
        icon="vd-icon-xmark"
        ariaLabel="Clear search"
        (click)="clearAction(); $event.stopPropagation()"
      ></vd-icon-button>
    </span>
  </div>
</div>
