<i
  class="vd-icon"
  [class.vd-icon--primary]="color === 'primary'"
  [class.vd-icon--success]="color === 'success'"
  [class.vd-icon--error]="color === 'error'"
  [class.vd-icon--info]="color === 'info'"
  [class.vd-icon--warning]="color === 'warning'"
  [class.vd-icon--neutral]="color === 'neutral'"
  [class]="name + ' ' + sizeClass"
></i>
