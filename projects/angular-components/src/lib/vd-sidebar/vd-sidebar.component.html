<div class="vd-sidebar">
  <!-- Other sections -->
  <div *ngFor="let section of sections" class="vd-sidebar__section">
    <div *ngIf="section.showTitle !== false" class="vd-sidebar__title-container">
      <p class="vd-sidebar__title body-small">{{ section.title }}</p>
      <vd-divider></vd-divider>
    </div>

    <ul>
      <li *ngFor="let item of section.items">
        <!-- Parent item with children -->
        <ng-container *ngIf="item.children && item.children.length > 0">
          <!-- If parent has a route, make it a link -->
          <a
            *ngIf="item.route"
            [routerLink]="item.route"
            class="vd-sidebar__item vd-sidebar__item--parent"
            [class.active]="isItemActive(item)"
            [class.vd-sidebar__item--child-active]="isChildActive(item)"
            [attr.aria-current]="isRouteActive(item.route, item.matchMode) ? 'page' : null"
            (click)="toggleExpand(item.label, $event)"
          >
            <span class="vd-sidebar__item-content">
              <vd-icon
                *ngIf="item.icon"
                class="vd-sidebar__item-icon"
                [name]="item.icon"
              ></vd-icon>
              <span class="vd-sidebar__item-label">{{ item.label }}</span>
            </span>
            <vd-icon
              [class.vd-sidebar__icon--expanded]="isExpanded(item.label)"
              name="vd-icon-caret-right"
            ></vd-icon>
          </a>
          <!-- If parent doesn't have a route, make it a div -->
          <div
            *ngIf="!item.route"
            class="vd-sidebar__item vd-sidebar__item--parent label-medium"
            [class.active]="isItemActive(item)"
            [class.vd-sidebar__item--child-active]="isChildActive(item)"
            (click)="toggleExpand(item.label)"
          >
            <span class="vd-sidebar__item-content">
              <vd-icon
                *ngIf="item.icon"
                class="vd-sidebar__item-icon"
                [name]="item.icon"
              ></vd-icon>
              <span class="vd-sidebar__item-label">{{ item.label }}</span>
            </span>
            <vd-icon
              [class.vd-sidebar__icon--expanded]="isExpanded(item.label)"
              name="vd-icon-caret-right"
            ></vd-icon>
          </div>
          <!-- Nested children -->
          <ul *ngIf="isExpanded(item.label)" class="vd-sidebar__nested-items">
            <li *ngFor="let child of item.children">
              <a
                [routerLink]="child.route"
                class="vd-sidebar__item vd-sidebar__item--nested"
                [class.active]="isItemActive(child)"
                [attr.aria-current]="isRouteActive(child.route, child.matchMode) ? 'page' : null"
              >
                <span class="vd-sidebar__item-content">
                  <vd-icon
                    *ngIf="child.icon"
                    class="vd-sidebar__item-icon"
                    [name]="child.icon"
                  ></vd-icon>
                  <span class="vd-sidebar__item-label">{{ child.label }}</span>
                </span>
              </a>
            </li>
          </ul>
        </ng-container>

        <!-- Regular item (with route, no children) -->
        <ng-container *ngIf="!item.children || item.children.length === 0">
          <a
            *ngIf="item.route"
            [routerLink]="item.route"
            class="vd-sidebar__item"
            [class.active]="isItemActive(item)"
            [attr.aria-current]="isRouteActive(item.route, item.matchMode) ? 'page' : null"
          >
            <span class="vd-sidebar__item-content">
              <vd-icon
                *ngIf="item.icon"
                class="vd-sidebar__item-icon"
                [name]="item.icon"
              ></vd-icon>
              <span class="vd-sidebar__item-label">{{ item.label }}</span>
            </span>
          </a>
        </ng-container>
      </li>
    </ul>
  </div>
</div>
