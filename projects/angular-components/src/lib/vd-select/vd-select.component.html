<div
  class="vd-select"
  [class.vd-select--error]="state === 'error'"
  [class.vd-select--disabled]="disabled"
  [class.vd-select--success]="state === 'success'"
  [class.vd-select--warning]="state === 'warning'"
>
  <!-- Label row -->
  <div class="vd-select__label-row" *ngIf="label || optional || hintText">
    <label *ngIf="label" class="vd-select__label" [attr.for]="selectId">
      {{ label }}
    </label>

    <vd-icon *ngIf="hintText" name="vd-icon-help" [vdTooltip]="hintText"> ></vd-icon>
    <p *ngIf="optional" class="vd-select__optional body-medium-italic">Optional</p>
  </div>

  <div class="vd-select__container" (click)="focusSelect()">
    <span *ngIf="leadingIcon" class="vd-select__leading-icon">
      <vd-icon [name]="leadingIcon"></vd-icon>
    </span>

    <select
      #selectElement
      [id]="selectId"
      class="vd-select__input body-medium"
      [disabled]="disabled"
      [value]="value !== null ? value : ''"
      [class.placeholder]="!value"
      (focus)="onFocus()"
      (blur)="onBlur()"
      (change)="onChange($event)"
    >
      <option *ngIf="placeholder" value="" disabled selected hidden>{{ placeholder }}</option>
      <option
        *ngFor="let opt of options"
        [value]="opt.value"
        [disabled]="opt.disabled"
        [selected]="opt.value === value"
      >
        {{ opt.label }}
      </option>
    </select>

    <span *ngIf="trailingStateIcon" class="vd-select__trailing-icon state">
      <vd-icon [name]="trailingStateIcon"></vd-icon>
    </span>

    <span class="vd-select__caret">
      <vd-icon name="vd-icon-caret-down"></vd-icon>
    </span>
  </div>

  <!-- Helper & counter row -->
  <div class="vd-select__helper-row" *ngIf="helperText">
    <span *ngIf="helperText" class="vd-select__helper-text body-small">
      {{ helperText }}
    </span>
  </div>
</div>
