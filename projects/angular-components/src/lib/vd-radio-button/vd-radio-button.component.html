<label class="vd-radio" [class.vd-radio--checked]="checked" [class.vd-radio--disabled]="disabled">
  <span class="vd-radio__icon-container">
    <input
      #inputRef
      class="vd-radio__input"
      type="radio"
      [id]="inputId"
      [name]="name"
      [value]="value"
      [checked]="checked"
      [disabled]="disabled"
      [attr.aria-checked]="checked"
      [attr.aria-label]="ariaLabel || label"
      (change)="onInputChange($event)"
      (blur)="onBlur()"
    />
    <span class="vd-radio__circle">
      <span *ngIf="checked" class="vd-radio__dot"></span>
    </span>
  </span>
  <span *ngIf="label || description" class="vd-radio__content">
    <span *ngIf="label" class="vd-radio__label label-medium">{{ label }}</span>
    <span *ngIf="description" class="vd-radio__description body-medium">
      {{ description }}
    </span>
  </span>
</label>
