<div class="vd-loading-state">
  <span class="vd-loading-state__spinner">
    <span class="vd-loading-state__spinner-indicator"></span>
  </span>

  <div class="vd-loading-state__text-content">
    <h3 class="vd-loading-state__title title-large">{{ title }}</h3>
    @if (description) {
      <p class="vd-loading-state__description body-medium">{{ description }}</p>
    }
  </div>
</div>
